name: Seoul youth housing daily alert

on:
  schedule:
    - cron: "17 0 * * *" # KST 09:17 daily
  workflow_dispatch:
    inputs:
      dry_run:
        description: "알림 전송 없이 조회 결과만 확인"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: seoul-youth-alert
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test date parsing and delivery state
        run: python -m unittest discover -s tests -v
      - name: Crawl and notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_DAYS: "7"
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python bot.py --dry-run
          else
            python bot.py
          fi
      - name: Save successful deliveries even if a later message failed
        if: always()
        run: |
          if [ -f state.json ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add state.json
            if ! git diff --cached --quiet; then
              git commit -m 'Save daily notification state'
              git pull --rebase origin "${{ github.event.repository.default_branch }}"
              git push origin "HEAD:${{ github.event.repository.default_branch }}"
            fi
          fi
